<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#4a3728" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Levain" />
    <meta name="description" content="Your sourdough companion - Plan bakes, track starters, log your journey" />
    <title>Levain - Sourdough Companion</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;500;600&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Loading screen styles (inline to show immediately) -->
    <style>
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(145deg, #5a4234 0%, #4a3728 50%, #3d2d20 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
      }
      #loading-screen.hidden {
        opacity: 0;
        visibility: hidden;
      }
      #loading-text {
        margin-top: 24px;
        font-family: 'Playfair Display', serif;
        font-size: 28px;
        font-weight: 600;
        color: #f5e6d3;
        letter-spacing: 1px;
      }
      #loading-spinner {
        margin-top: 32px;
        display: flex;
        gap: 8px;
      }
      .spinner-dot {
        width: 10px;
        height: 10px;
        background-color: #d4a574;
        border-radius: 50%;
        animation: bounce 1.4s ease-in-out infinite both;
      }
      .spinner-dot:nth-child(1) { animation-delay: -0.32s; }
      .spinner-dot:nth-child(2) { animation-delay: -0.16s; }
      .spinner-dot:nth-child(3) { animation-delay: 0s; }
      @keyframes bounce {
        0%, 80%, 100% {
          transform: scale(0.6);
          opacity: 0.5;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }
      #loading-tagline {
        margin-top: 16px;
        font-family: 'Crimson Pro', serif;
        font-size: 14px;
        color: #c4a882;
        letter-spacing: 0.5px;
      }
    </style>
  </head>
  <body>
    <!-- Loading screen -->
    <div id="loading-screen">
      <div id="loading-text">Levain</div>
      <div id="loading-spinner">
        <div class="spinner-dot"></div>
        <div class="spinner-dot"></div>
        <div class="spinner-dot"></div>
      </div>
      <div id="loading-tagline">Your sourdough companion</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
